name: eMAG Resigilate Scraper

on:
  schedule:
    # Rulează automat din 15 în 15 minute
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permite declanșarea manuală oricând

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          PROFITSHARE_USER: ${{ secrets.PROFITSHARE_USER }}
          PROFITSHARE_KEY: ${{ secrets.PROFITSHARE_KEY }}
        run: |
          python main.py --once
